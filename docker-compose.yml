# Rinha 2026 — pure-asm fraud detection stack.
#
# Topology:  LB :9999 → SCM_RIGHTS → asm_server × 2 (via Unix-socket ctrl channel)
#
# Resource budget (Rinha rule: total ≤ 1 CPU + 350 MB):
#   lb   : 0.050 CPU /  30 MB   (TCP accept + sendmsg, no payload touch; LB sits at <1% CPU under stress, so any quota we give it is wasted)
#   api1 : 0.475 CPU / 160 MB   (87 MB index mmap + buffers + epoll state)
#   api2 : 0.475 CPU / 160 MB
#   -----  total: 1.000 CPU / 350 MB
#
# Per-service `cpuset` pins each API to a dedicated physical core (both SMT
# threads) on the 2-core Mac Mini target; LB scavenges any free core.
#
# The Unix sockets for the LB ↔ API control channel live on a shared volume
# so both APIs can be reached from the LB by path.

x-asm: &asm
  build:
    context: .
    dockerfile: Dockerfile
  image: rinha-asm:latest
  restart: unless-stopped
  networks:
    - rinha-net
  cap_add:
    - IPC_LOCK
  ulimits:
    memlock: -1
    nofile: 65535
  security_opt:
    - seccomp=unconfined
    - apparmor=unconfined

services:
  api1:
    <<: *asm
    command:
      - /asm_server
      - /sockets/api1.sock
      - /index.bin
    volumes:
      - sockets:/sockets
    cpuset: "0,1"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    <<: *asm
    command:
      - /asm_server
      - /sockets/api2.sock
      - /index.bin
    volumes:
      - sockets:/sockets
    cpuset: "2,3"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  lb:
    <<: *asm
    command:
      - /asm_lb
      - "9999"
