x-asm: &asm
  image: ghcr.io/vinicius-piassa/rinha-backend-2026-asm:cbdcbd2
  platform: linux/amd64
  restart: unless-stopped
  networks:
    - rinha-net
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

services:
  api1:
    <<: *asm
    command:
      - /asm_server
      - /sockets/api1.sock
    working_dir: /
    volumes:
      - sockets:/sockets
    # judge = Mac Mini Late 2014 (i5-4278U, 2C/4T): cpu 0,1 are HT pair on
    # physical core 0; cpu 2,3 on physical core 1.  Pin api1 to thread 0
    # (primary) so its L1i/L1d stays hot; HT sibling cpu 1 goes to LB.
    cpuset: "0"
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "171MB"

  api2:
    <<: *asm
    command:
      - /asm_server
      - /sockets/api2.sock
    working_dir: /
    volumes:
      - sockets:/sockets
    # api2 pinned to thread 0 of physical core 1.  HT sibling cpu 3 → LB.
    cpuset: "2"
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "171MB"

  lb:
    <<: *asm
    command:
      - /asm_lb
      - "9999"
      - /sockets/api1.sock
      - /sockets/api2.sock
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    # LB on HT siblings (cpu 1 = sibling of api1's cpu 0; cpu 3 = sibling
    # of api2's cpu 2).  SCM_RIGHTS handoff becomes intra-physical-core
    # (~10cy IPI vs ~80cy cross-core).  LB only consumes ~5% CPU so it
    # uses the HT idle slots without disturbing API L1 caches.
    cpuset: "1,3"
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "8MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0777

networks:
  rinha-net:
    driver: bridge
